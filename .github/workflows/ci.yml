name: CI

# Tests and the index check. Neither job calls a model or needs an API key.
# The index is built locally and only its manifest is committed. CI checks the manifest by hash.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest

  index:
    runs-on: ubuntu-latest
    env:
      CORPUS_REPOSITORY: glassops-platform/glassops
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Read the commit the index was built from
        id: manifest
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys
          m = json.load(open("index/manifest.json", encoding="utf-8"))
          sha = m.get("source_commit", "")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              sys.exit("index/manifest.json has no source_commit. Rebuild the index from a git checkout.")
          print(f"sha={sha}")
          PY

      - name: Check out the docs the index was built from
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CORPUS_REPOSITORY }}
          ref: ${{ steps.manifest.outputs.sha }}
          path: corpus
          persist-credentials: false

      - name: Check the manifest against those docs
        run: python main.py --check-index --root corpus

      - name: Check out the latest docs
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CORPUS_REPOSITORY }}
          path: corpus-latest
          persist-credentials: false

      - name: Report whether the index is behind the latest docs
        run: |
          if python main.py --check-index --root corpus-latest; then
            echo "The index matches the latest docs."
          else
            echo "::warning::The index is behind the latest docs in $CORPUS_REPOSITORY. Rebuild it locally and commit index/manifest.json."
          fi
